name: CI - Growth SEO Command Center

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests and validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Descargar el código del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configurar Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Configurar Node.js para validar JavaScript
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Instalar las herramientas necesarias para las pruebas
      - name: Install test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      # Ejecutar las pruebas y validaciones del proyecto
      - name: Run project CI checks
        run: python scripts/ci_check.py
